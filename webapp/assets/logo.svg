<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="aBlue" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#1EA7E8"/>
      <stop offset="1" stop-color="#173F92"/>
    </linearGradient>
    <linearGradient id="drop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22A9EC"/>
      <stop offset="1" stop-color="#1A4FA8"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2E9B45"/>
      <stop offset="1" stop-color="#8DC63F"/>
    </linearGradient>
    <linearGradient id="wifi" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#3DAE49"/>
      <stop offset="1" stop-color="#1EA7E8"/>
    </linearGradient>
  </defs>
  <!-- the "A" (no crossbar: the leaf is the crossbar) -->
  <path d="M53 10 H75 L119 114 H96 L64 37 L32 114 H9 Z" fill="url(#aBlue)"/>
  <!-- water drop -->
  <path d="M64 42 C64 42 47 64 47 79 a17 17 0 0 0 34 0 C81 64 64 42 64 42 Z" fill="url(#drop)"/>
  <!-- sparkle -->
  <path d="M64 58 L66 64 L72 66 L66 68 L64 74 L62 68 L56 66 L62 64 Z" fill="#FFFFFF"/>
  <!-- circuit traces -->
  <g fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M64 95 V79"/>
    <path d="M58 95 V87 L54 83 V80"/>
    <path d="M70 95 V87 L74 83 V80"/>
  </g>
  <g fill="#1A4FA8" stroke="#FFFFFF" stroke-width="1.8">
    <circle cx="64" cy="77" r="2.3"/>
    <circle cx="54" cy="78" r="2.3"/>
    <circle cx="74" cy="78" r="2.3"/>
  </g>
  <!-- leaf swoosh -->
  <path d="M22 102 C42 88 60 101 82 94 C98 89 110 76 118 60 C116 86 98 106 72 108 C54 109 38 104 22 102 Z" fill="url(#leaf)"/>
  <!-- signal -->
  <g fill="none" stroke="url(#wifi)" stroke-width="5" stroke-linecap="round">
    <path d="M100 26 A11 11 0 0 1 111 37"/>
    <path d="M100 14 A23 23 0 0 1 123 37"/>
  </g>
  <circle cx="101" cy="36" r="3.6" fill="#3DAE49"/>
</svg>
